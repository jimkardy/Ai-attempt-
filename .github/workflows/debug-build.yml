name: debug-build

on:
  push:
    branches: [debugging]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: debug-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned arm64 UML kernel (GPL-2.0). Provenance: native/uml/NOTICE.md
  UML_REPO: GlassOnTin/uml-transport
  UML_TAG: uml-guest-11
  KERNEL_ASSET: libvmlinux.so
  STUB_ASSET: libuml-stub.so
  KERNEL_SHA256: 14d39961761cdbc9fe5478ae4881eb548d79d12720213d6b65e8385dcf6eee16
  STUB_SHA256: 731c48d5bf42ef25e26625af6a02627a5d658bf9f67d6f7fc443d6d644d6e52e
  ROOTFS_ASSET: debroid-rootfs-trixie-arm64.ext4.gz

jobs:
  # ---------------------------------------------------------------- the APK
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK (command-line tools, no third-party action)
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          # `yes |` exits 141 via SIGPIPE when sdkmanager stops reading; that must not fail the step.
          ( yes || true ) | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"

      # The guest's init: a static aarch64 bionic binary. It replaces the old
      # `#!/bin/sh` script, so the first userspace program in the guest does no
      # glibc startup (rseq is the syscall Android's app seccomp filter traps),
      # and it sets GLIBC_TUNABLES=glibc.pthread.rseq=0 before starting bash.
      # It is installed into /sbin/debroid-init of the rootfs built below.
      - name: Build the guest init (static, arm64)
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          NDK="$SDK/ndk/27.0.12077973"
          mkdir -p dist
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang" \
            -static -O2 -s -Wall -Wextra -o dist/debroid-init native/init/debroid-init.c
          file dist/debroid-init
          readelf -h dist/debroid-init | grep -q "AArch64" || { echo "guest init is not aarch64"; exit 1; }
          if readelf -l dist/debroid-init | grep -qi interpreter; then
            echo "guest init is dynamically linked; it must be static"; exit 1
          fi
          test "$(stat -c%s dist/debroid-init)" -gt 100000 || { echo "guest init looks wrong"; exit 1; }
          ( cd dist && sha256sum debroid-init > debroid-init.sha256 && cat debroid-init.sha256 )

      # Debroid is arm64-v8a only. This tiny marker library is what makes Android
      # refuse to install the APK on 32-bit / x86 / x86_64 phones.
      - name: Build the arm64 ABI gate
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          NDK="$SDK/ndk/27.0.12077973"
          test -d "$NDK"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang" \
            -shared -fPIC -O2 -Wl,-z,max-page-size=16384 \
            -o app/src/main/jniLibs/arm64-v8a/libdebroid-abi.so native/abi-gate/abi_gate.c
          ls -l app/src/main/jniLibs/arm64-v8a/

      # The kernel itself: a static aarch64 *bionic* build from
      # GlassOnTin/uml-transport (GPL-2.0; source is zalexdev/linux-um-arm64 plus
      # the uml-transport patches). This is the build that is known to boot a
      # guest inside an Android app sandbox, and the difference is exactly what
      # 0.3.4 died on: UML calls `personality()` when it starts the guest init,
      # Android's app seccomp policy traps that call with SIGSYS, and the
      # android-app-compat patch skips the re-exec path that makes it. The linked
      # libc is also neutered for the syscalls the policy force-kills
      # (set_robust_list, rseq, close_range).
      # The artifact carries ~68 MB of DWARF; --strip-debug takes it to ~9 MB and
      # keeps the loadable segment byte-identical (verified by sha256 of the
      # ORIGINAL download above).
      - name: Fetch the pinned arm64 UML kernel
        run: |
          set -euo pipefail
          BASE="https://github.com/${UML_REPO}/releases/download/${UML_TAG}"
          DEST=app/src/main/jniLibs/arm64-v8a
          mkdir -p "$DEST"
          curl -fsSL --retry 3 -o /tmp/uml-kernel-unstripped "$BASE/${KERNEL_ASSET}"
          curl -fsSL --retry 3 -o "$DEST/libstub_exe.so" "$BASE/${STUB_ASSET}"
          echo "${KERNEL_SHA256}  /tmp/uml-kernel-unstripped" | sha256sum -c -
          echo "${STUB_SHA256}  $DEST/libstub_exe.so" | sha256sum -c -
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "$SDK/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" \
            --strip-debug -o "$DEST/libuml-kernel.so" /tmp/uml-kernel-unstripped
          rm -f /tmp/uml-kernel-unstripped
          chmod 0755 "$DEST/libuml-kernel.so" "$DEST/libstub_exe.so"
          file "$DEST/libuml-kernel.so" "$DEST/libstub_exe.so"
          readelf -h "$DEST/libuml-kernel.so" | grep -q AArch64
          if readelf -l "$DEST/libuml-kernel.so" | grep -qi interpreter; then
            echo "the kernel is dynamically linked; it must be static"; exit 1
          fi
          test "$(stat -c%s "$DEST/libuml-kernel.so")" -lt 40000000 || { echo "kernel still carries debug info"; exit 1; }
          # Gate: a syscall site the app seccomp policy force-kills must never ship
          # unpatched. The build fails here rather than on someone's phone.
          python3 - "$DEST/libuml-kernel.so" <<'PY'
          import struct, sys
          data = open(sys.argv[1], 'rb').read()
          n = len(data) // 4
          words = struct.unpack_from('<%dI' % n, data, 0)
          SVC0 = 0xD4000001
          targets = {}
          for num, name in ((99, 'set_robust_list'), (293, 'rseq'), (436, 'close_range')):
              for enc in (0xD2800000 | (num << 5) | 8, 0x52800000 | (num << 5) | 8):
                  targets[enc] = name
          bad = {}
          for i in range(n - 16):
              name = targets.get(words[i])
              if not name:
                  continue
              for j in range(i + 1, min(i + 16, n)):
                  if words[j] == SVC0:
                      bad[name] = bad.get(name, 0) + 1
                      break
                  if words[j] in targets:
                      break
          if bad:
              sys.exit('kernel still issues a seccomp-killed syscall: %s' % bad)
          print('app-seccomp gate: 0 unpatched svc sites')
          PY
          ls -l "$DEST"

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace \
            -PdebroidReleaseRepo="${{ github.repository }}" assembleDebug

      - name: Verify the APK is installable
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BT="$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)"
          APK="$(find app/build/outputs/apk/debug -name '*.apk' | head -1)"
          test -n "$APK"
          echo "== APK: $APK ($(stat -c%s "$APK") bytes)"
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          "$BT/zipalign" -c -v 4 "$APK" > /dev/null && echo "ZIPALIGN_OK"
          BADGING="$("$BT/aapt2" dump badging "$APK")"
          echo "$BADGING" | grep -E "package:|sdkVersion|targetSdkVersion|native-code|application-label:" || true
          # Enforce the support contract: arm64 only, Android 10 floor.
          echo "$BADGING" | grep -q "native-code: 'arm64-v8a'" || { echo "MISSING arm64-v8a native code: APK would install on unsupported CPUs"; exit 1; }
          echo "$BADGING" | grep -q "minSdkVersion:'29'" || { echo "minSdk is not 29"; exit 1; }
          # The kernel and the stub helper must actually be inside the APK.
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libuml-kernel.so" || { echo "UML kernel missing from the APK"; exit 1; }
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libstub_exe.so" || { echo "UML stub helper missing from the APK"; exit 1; }
          echo "ABI_GATE_OK"
          mkdir -p dist
          cp "$APK" dist/app-debug.apk
          ( cd dist && sha256sum app-debug.apk > apk.sha256 )

      - name: Read app version from the APK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BT="$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)"
          LINE="$("$BT/aapt2" dump badging dist/app-debug.apk | head -1)"
          VERSION_NAME="$(sed -E "s/.*versionName='([^']+)'.*/\1/" <<<"$LINE")"
          VERSION_CODE="$(sed -E "s/.*versionCode='([^']+)'.*/\1/" <<<"$LINE")"
          test -n "$VERSION_NAME" && test -n "$VERSION_CODE"
          echo "APK version: $VERSION_NAME ($VERSION_CODE)"
          # The release tag must follow app/build.gradle.kts, otherwise every build
          # would overwrite the same pre-release.
          echo "$VERSION_NAME" > dist/version.txt
          echo "$GITHUB_SHA" > dist/commit.txt

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: debroid-apk
          path: dist/*
          if-no-files-found: error

  # ------------------------------------------------------------- the guest fs
  # A real Debian trixie arm64 filesystem in a 2 GiB ext4 image, built on a native
  # arm64 runner (no qemu). It is published with the APK, so the APK and the image
  # it boots always come from the same commit.
  rootfs:
    # The image installs the guest init built by the apk job, so it must wait for
    # that artifact to exist (upload-artifact v4 artifacts only appear when the
    # producing job has uploaded them).
    needs: apk
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # The init is compiled by the apk job (x86_64 runner, same pinned NDK) and
      # handed over as an artifact, so the image always contains that exact binary.
      - name: Fetch the guest init built by the apk job
        uses: actions/download-artifact@v4
        with:
          name: debroid-apk
          path: init-artifact

      - name: Verify the guest init is static aarch64
        run: |
          set -euo pipefail
          ls -l init-artifact
          file init-artifact/debroid-init
          readelf -h init-artifact/debroid-init | grep -q "AArch64"
          if readelf -l init-artifact/debroid-init | grep -qi interpreter; then
            echo "guest init is dynamically linked; it must be static"; exit 1
          fi

      - name: Build the Debian trixie arm64 disk image
        run: |
          set -euo pipefail
          mkdir -p dist
          docker run --rm \
            -e ROOTFS_ASSET="${ROOTFS_ASSET}" \
            -v "$PWD/dist:/out" \
            -v "$PWD/init-artifact:/init-src:ro" \
            debian:trixie bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends debootstrap e2fsprogs gzip ca-certificates
              debootstrap --variant=minbase --arch=arm64 \
                --include=iproute2,procps,e2fsprogs,less,curl,ca-certificates,nano,kmod,locales \
                trixie /chroot http://deb.debian.org/debian
              install -m 0755 /init-src/debroid-init /chroot/sbin/debroid-init
              printf "debroid\n" > /chroot/etc/hostname
              printf "127.0.0.1 localhost debroid\n::1 localhost debroid\n" > /chroot/etc/hosts
              printf "nameserver 1.1.1.1\nnameserver 9.9.9.9\n" > /chroot/etc/resolv.conf
              printf "proc /proc proc defaults 0 0\nsysfs /sys sysfs defaults 0 0\ndevpts /dev/pts devpts defaults 0 0\ntmpfs /tmp tmpfs defaults 0 0\n" > /chroot/etc/fstab
              test -x /chroot/sbin/debroid-init
              head -c 4 /chroot/sbin/debroid-init | od -An -tx1 | tr -d " \n" | grep -qx "7f454c46" \
                || { echo "debroid-init is not an ELF binary"; exit 1; }
              test -f /chroot/etc/debian_version
              truncate -s 2G /out/base.ext4
              mke2fs -q -t ext4 -d /chroot -L debroid-root -O ^has_journal -m 0 /out/base.ext4
              dumpe2fs -h /out/base.ext4 | grep -q "Filesystem magic number:.*0xEF53"
              gzip -9 -c /out/base.ext4 > "/out/$ROOTFS_ASSET"
              rm -f /out/base.ext4
              du -h "/out/$ROOTFS_ASSET"
            '

      - name: Verify and checksum the image
        run: |
          set -euo pipefail
          ls -l dist
          test -f "dist/${ROOTFS_ASSET}" || { echo "the rootfs asset was not produced"; exit 1; }
          python3 - "dist/${ROOTFS_ASSET}" <<'PY'
          import gzip, sys, os
          path = sys.argv[1]
          with gzip.open(path, "rb") as f:
              head = f.read(1200)
          magic = head[1080:1082]
          assert magic == b"\x53\xef", f"no ext4 superblock magic, got {magic!r}"
          size = os.path.getsize(path)
          print(f"ext4 magic ok, asset {size} bytes ({size/1024/1024:.1f} MB compressed)")
          PY
          ( cd dist && sha256sum "${ROOTFS_ASSET}" > rootfs.sha256 && cat rootfs.sha256 )

      - name: Upload the guest image
        uses: actions/upload-artifact@v4
        with:
          name: debroid-rootfs
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------- the release
  release:
    needs: [apk, rootfs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download both artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach the third-party notice and read the version
        run: |
          set -euo pipefail
          cp native/uml/NOTICE.md dist/NOTICE.md
          ls -l dist
          VERSION_NAME="$(cat dist/version.txt)"
          test -n "$VERSION_NAME"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "release tag: debug-v$VERSION_NAME"

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-v${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          name: Debroid ${{ env.VERSION_NAME }} - debug build (install and test)
          prerelease: true
          files: |
            dist/app-debug.apk
            dist/apk.sha256
            dist/${{ env.ROOTFS_ASSET }}
            dist/rootfs.sha256
            dist/debroid-init
            dist/debroid-init.sha256
            dist/NOTICE.md
          body: |
            **Debug build — install and test.** Not stable, not finished. MIT licensed app code,
            GPL-2.0 kernel: every file in this release says where it came from.

            **Built from commit `${{ github.sha }}`** — this tag's *Source code (zip/tar.gz)* is
            exactly the code this APK was compiled from, including the workflow that built it.

            **arm64-v8a only, Android 10–15.** 32-bit, x86 and x86_64 phones are refused at install.

            ## What is new in 0.4.0

            - **It should actually boot now.** 0.3.4 died at the very last startup line,
              `Run /sbin/debroid-init as init process`, with exit 159. That is the point where
              UML calls `personality()` before handing over to the guest init, and Android's app
              seccomp policy traps that call with `SECCOMP_RET_TRAP` + `force_sig_info` — no
              handler and no ptrace can save it, which is why the tombstone never appeared. The
              APK now ships the arm64 UML kernel build that other Android projects use to boot
              real guests (`GlassOnTin/uml-transport`, GPL-2.0, same `zalexdev/linux-um-arm64`
              source plus three patches): it skips the `personality()` re-exec path when built
              for Android, loads the stub with a plain `execve` (Android refuses memfd exec), and
              has the `set_robust_list`, `rseq` and `close_range` syscall sites neutered. CI
              verifies the stripped binary is static AArch64 and has zero unpatched
              seccomp-killed sites before it may enter an APK.
            - **Two userspaces, one automatic retry.** Start uses `seccomp=on` (in-process
              syscall trapping). If this Android build refuses it with SIGSYS while starting, the
              VM is relaunched once in the `ptrace` userspace, which the sandbox always allows but
              which is slower. The console says which one is running.
            - **Log capture now reads only this app.** It used to run `logcat -b all`, i.e. every
              app and system service on the phone. It is now filtered with `--uid=<our uid>`, so
              only Debroid's own processes (including the UML kernel process it spawns) can ever
              appear in the log panel, the report or a ZIP.
            - **No personal traces in published files.** The app no longer hard-codes a repository
              path and the report no longer shows one: the release location is supplied at build
              time. The Debug tab's bottom button now runs the self-test, copies the report and
              opens the share sheet; it does not talk to GitHub at all.

            ## What was new in 0.3.4

            - **`seccomp=on` is not possible in an Android app, so it is gone.** 0.3.3 got as far as
              `Checking that seccomp filters can be installed...` and then died: the port's SECCOMP
              mode installs its own BPF filter with the `seccomp()` syscall, and that syscall is not in
              bionic's app allowlist, so Android traps it with SIGSYS (exit 159). No APK can change
              that — it is the sandbox. The kernel is launched in the ptrace userspace again, which is
              the only mode that can run here (one guest CPU, as before).
            - **The report now names the syscall that killed the guest.** Android writes a tombstone
              into logcat's `crash` buffer that says `Cause: seccomp prevented call to disallowed arm64
              system call <n>`. That buffer was not being read and rotated away, which is why earlier
              reports said "logcat traps: none captured". 0.3.4 streams `logcat -b all`, keeps every
              matching line in a small ring that log rotation cannot drop, snapshots the crash buffer
              the moment the kernel process exits, and prints the decoded name (for example
              `set_robust_list (arm64 syscall 99)`) in the console and in `--- seccomp ---`.
            - The Debug tab's **extra kernel parameters** field is unchanged: it is still the way to
              try a variant without a new build.

            ## What is new in 0.3.3

            - **The missing switch: `seccomp=on`.** The kernel was starting in its ptrace userspace
              mode because nothing asked for anything else, and in that mode every guest syscall is
              intercepted with ptrace. Android's app seccomp filter then killed the guest with SIGSYS
              (exit 159) at its first syscall, which is what the 0.3.2 report showed. The port's
              `SECCOMP` userspace mode exists for exactly this host: the guest's syscalls are trapped
              and emulated in-process instead of being traced. It is now passed on every launch — the
              boot log will say `Userspace mode: SECCOMP` instead of `ptrace`.
            - The Debug tab has a small **extra kernel parameters** field (debug builds). It is appended
              to the kernel command line after the defaults, so `seccomp=auto`, `nocancel` or
              `con0=null,fd:1` can be tried without a new APK, and the Engine log records it.
            - The static guest init, exit-code explanations, growable disk and in-guest trim from 0.3.2
              are unchanged and included.

            ## What arrived in 0.3.2

            - **The reason 0.3.1 did not boot is now handled.** Every Start died in ~0.4 s with exit
              code 159 = 128 + 31 (SIGSYS): Android's app seccomp filter trapped a system call made by
              glibc at the very first guest process. `/sbin/debroid-init` is no longer a shell script
              but a static aarch64 binary that does no glibc startup of its own and starts bash with
              `GLIBC_TUNABLES=glibc.pthread.rseq=0`. It is attached to this release
              (`debroid-init` + checksum) and inside the filesystem image.
            - Logs explain exits in words: 159 (SIGSYS/seccomp), 137 (low-memory killer), 139 (crash),
              and the report has a new `--- seccomp ---` section with the matching logcat lines.
            - The `umid_file_name : buffer too short` warning is gone (no `umid=` any more; only one VM
              runs at a time and TMPDIR already isolates it).
            - **The disk really grows.** Raising the disk slider on a stopped VM extends its sparse
              image immediately; the guest's filesystem fills it on the next boot. The editor shows
              reserved size, the filesystem inside it and what the disk actually costs on Android.
            - **Trimming now happens inside the VM.** Deleting a 1 GB file inside the guest no longer
              costs Android 1 GB: "Trim this VM's disk" runs `fstrim -v /` in the guest, UML's ubd
              driver punches the holes into `disk.img`, and the result shows Android's real usage
              before and after. The old host-side `fstrim /data` — which could never help — is gone.
            - The Debug tab is simpler: **Copy everything** at the top (unchanged), and one big
              **"Having issues? Send the report to our team on GitHub"** button at the bottom that runs
              the self-test, copies the report and opens a new issue with it. Self-test / Share / ZIP /
              Issue / Clear / Host shell are folded into that one button.
            - Everything from 0.3.1 and 0.3.0 below.

            ## What arrived in 0.3.1

            - Pressing Start on a VM without a disk image hands the console to that VM at once, so the
              Terminal tab shows the Debian image download; Stop or Delete during the download cancels
              it instead of booting behind your back.

            ## What arrived in 0.3.0

            - **VMs actually boot.** The APK now ships the arm64 UML kernel
              (`zalexdev/linux-um-arm64`, GPL-2.0, pinned commit `${{ env.UML_COMMIT }}`), so Start
              runs a real Linux kernel as an ordinary app process — no root, no KVM.
            - The Debian 13 (trixie) arm64 disk image is attached to this release
              (`${{ env.ROOTFS_ASSET }}`). Debroid fetches it once, on the first Start, keeps it for
              every VM and clones it per VM. It is far too large to live inside an APK.
            - Each VM gets its own writable ext4 disk on UML's `ubd0`; the guest grows the
              filesystem to the disk size you reserved, at boot.
            - **Edit button**: the small gear at the top right of each VM card opens an editor for
              name, cores, RAM, disk and port forwards, with the same device-bounded controls as the
              create form.
            - **Reclaim Android storage** (inside the editor): runs `fstrim -v /` and clears
              Debroid's own caches, and reports exactly what Android answered. Android only allows
              `fstrim` for root, so on a stock phone it tells you it was refused instead of lying.
            - Much more logging: the Engine channel records the full kernel argv, the files and
              sizes involved, the image download and the exit code, so a failed boot is reproducible.
            - Logs are capped at **100 MB total** with rotation; old rotated files are dropped first.

            Install: download the APK, allow "install unknown apps" for your browser/file manager,
            tap it. It is signed with the repo's throwaway test key, so newer debug builds install
            over this one without uninstalling. Needs a network connection the first time you press
            Start (to fetch the Debian image).

            If anything goes wrong: Debug tab → **Copy everything** → paste it into an issue here.
